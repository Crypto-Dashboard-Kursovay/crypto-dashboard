global:
  scrape_interval: 15s
  scrape_timeout: 2s
  evaluation_interval: 15s

scrape_configs:
  - job_name: lightstar_backend
    scrape_interval: 3s
    scrape_timeout: 2s
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000

  - job_name: lightstar_engine
    scrape_interval: 3s
    scrape_timeout: 2s
    metrics_path: /metrics
    static_configs:
      - targets:
          - engine:9100
